name: mipay_app
description: "Your personalized ai wallet tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.7.0

  # Auth token storage
  flutter_secure_storage: ^9.2.2

  # Audio recording
  record: ^6.1.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # Charts
  fl_chart: ^0.69.0

  # Localization
  intl: ^0.20.2

  # Immutable models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
